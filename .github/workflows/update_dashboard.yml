name: Update Loho Dashboard

on:
  schedule:
    # Chạy 2 lần/ngày theo giờ Việt Nam: 9h30 và 15h30.
    # GitHub Actions dùng giờ UTC; VN = UTC+7 (không có DST) => 02:30 & 08:30 UTC.
    # Lưu ý: GitHub có thể chạy trễ vài phút so với giờ hẹn.
    - cron: '30 2 * * *'   # 09:30 giờ VN
    - cron: '30 8 * * *'   # 15:30 giờ VN
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: 'Asia/Ho_Chi_Minh'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update_dashboard.py
        run: |
          python update_dashboard.py index.html

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            VN_TIME=$(date '+%d/%m/%Y %H:%M')
            git commit -m "Auto-update dashboard $VN_TIME"
            git push
            echo "Pushed update at $VN_TIME (Asia/Ho_Chi_Minh)"
          fi
